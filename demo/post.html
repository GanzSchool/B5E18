<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eszköz módosítása</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <h1 class="mb-4">Eszköz módosítása</h1>

        <div class="row g-3 align-items-end mb-4">

            <div class="col-md-4">
                <label class="form-label">Eszköz ID</label>

                <input
                    id="eszkozId"
                    class="form-control"
                    type="number"
                >
            </div>

            <div class="col-md-auto">
                <button
                    id="betoltesGomb"
                    class="btn btn-primary"
                    type="button"
                >
                    Adatok betöltése
                </button>
            </div>

        </div>

        <div id="betoltesUzenet"></div>


        <form id="modositasForm">

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Név</label>
                    <input id="nev" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Leltári szám</label>
                    <input id="leltariSzam" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Kategória</label>
                    <input id="kategoria" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Gyártó</label>
                    <input id="gyarto" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Modell</label>
                    <input id="modell" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Terem</label>
                    <input id="terem" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Állapot</label>
                    <input id="allapot" class="form-control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Beszerzési ár</label>
                    <input id="beszerzesiAr" class="form-control" type="number" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Beszerzés dátuma</label>
                    <input id="beszerzesDatuma" class="form-control" type="date" required>
                </div>

                <div class="col-md-4">
                    <div class="form-check mt-4">
                        <input id="hasznalatbanVan" class="form-check-input" type="checkbox">
                        <label class="form-check-label">Használatban van</label>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-check mt-4">
                        <input id="kolcsonozheto" class="form-check-input" type="checkbox">
                        <label class="form-check-label">Kölcsönözhető</label>
                    </div>
                </div>

            </div>

            <button class="btn btn-warning mt-4" type="submit">
                Módosítás mentése
            </button>

        </form>

        <div id="uzenet" class="mt-3"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
